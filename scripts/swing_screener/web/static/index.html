<link rel="stylesheet" href="/static/style.css">
<script>(function () { var t, q = new URLSearchParams(location.search).get("theme");
  try { if (q) localStorage.setItem("theme", JSON.stringify(q)); t = JSON.parse(localStorage.getItem("theme")); } catch (e) { t = q; }
  t = t || "black"; if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "black";
  document.documentElement.dataset.theme = t;
  try { document.documentElement.dataset.density = JSON.parse(localStorage.getItem("density")) || "comfortable"; } catch (e) {} })();</script>
</head>
